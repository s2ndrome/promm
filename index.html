<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROMM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="workspace">
      <span class="ws-icon" id="ws-icon"></span>
      <span class="ws-name" id="ws-name"></span>
    </div>
    <nav class="nav">
      <a href="#/" data-route="/"><span>🏠</span>메인</a>
      <a href="#/gallery" data-route="/gallery"><span>🖼️</span>갤러리</a>
      <a href="#/world" data-route="/world"><span>🗺️</span>세계관</a>
    </nav>
  </aside>
  <div class="backdrop" id="sidebar-backdrop"></div>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="메뉴">☰</button>
      <span class="crumb" id="crumb"></span>
    </header>
    <main id="content"></main>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close" aria-label="닫기">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
